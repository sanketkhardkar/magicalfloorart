<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Megical Floor Art</title>

<style>

*{
box-sizing:border-box;
margin:0;
padding:0;
}

body{
font-family:Arial,sans-serif;
background:#f5f5f5;
color:#222;
}

/* HEADER */

header{
background:#111827;
color:white;
padding:12px 15px;
position:sticky;
top:0;
z-index:1000;
}

.header-content{
max-width:1100px;
margin:auto;
display:flex;
align-items:center;
justify-content:space-between;
}

.shop-name{
font-size:21px;
font-weight:bold;
}

.cart-button{
background:#25D366;
color:white;
border:0;
border-radius:25px;
padding:10px 15px;
font-size:15px;
font-weight:bold;
cursor:pointer;
}


/* PRODUCTS */

.container{
max-width:1100px;
margin:auto;
padding:15px;
}

.products{
display:grid;
grid-template-columns:repeat(2,1fr);
gap:12px;
}

.product{
background:white;
border-radius:14px;
overflow:hidden;
box-shadow:0 3px 12px #0001;
}


/* IMAGE */

.slider{
position:relative;
aspect-ratio:1;
overflow:hidden;
background:#eee;
touch-action:pan-y;
}

.slider img{
width:100%;
height:100%;
object-fit:cover;
display:block;
}


/* ARROWS */

.arrow{
position:absolute;
top:50%;
transform:translateY(-50%);
background:#0008;
color:white;
border:0;
width:34px;
height:34px;
border-radius:50%;
font-size:22px;
cursor:pointer;
}

.prev{
left:8px;
}

.next{
right:8px;
}


/* DOTS */

.dots{
position:absolute;
bottom:8px;
width:100%;
text-align:center;
}

.dot{
display:inline-block;
width:7px;
height:7px;
background:white;
border-radius:50%;
margin:3px;
opacity:.5;
}

.dot.active{
opacity:1;
}


/* PRODUCT INFO */

.product-info{
padding:12px;
}

.product-name{
font-size:16px;
font-weight:bold;
}

.price{
color:#16a34a;
font-size:18px;
font-weight:bold;
margin-top:6px;
}


/* QUANTITY */

.quantity{
display:flex;
align-items:center;
justify-content:space-between;
border:1px solid #ddd;
border-radius:8px;
overflow:hidden;
margin-top:10px;
}

.quantity button{
width:40px;
height:38px;
border:0;
background:#f3f4f6;
font-size:21px;
cursor:pointer;
}

.quantity span{
font-weight:bold;
}


/* MODAL */

.modal{
display:none;
position:fixed;
z-index:2000;
inset:0;
background:#0009;
padding:15px;
overflow-y:auto;
}

.modal.show{
display:flex;
align-items:center;
justify-content:center;
}

.modal-content{
background:white;
width:100%;
max-width:500px;
border-radius:16px;
padding:20px;
max-height:90vh;
overflow-y:auto;
}

.modal-header{
display:flex;
align-items:center;
justify-content:space-between;
margin-bottom:15px;
}

.modal-header h2{
font-size:21px;
}

.close{
border:0;
background:#f3f4f6;
width:35px;
height:35px;
border-radius:50%;
font-size:22px;
cursor:pointer;
}


/* FORM */

.form-title{
font-size:16px;
font-weight:bold;
margin-bottom:10px;
}

.customer-form input,
.customer-form textarea{
width:100%;
padding:12px;
margin-bottom:10px;
border:1px solid #ddd;
border-radius:8px;
font-size:15px;
outline:none;
}

.customer-form textarea{
height:75px;
resize:none;
}


/* ORDER */

.order-summary{
margin-top:10px;
border-top:1px solid #eee;
padding-top:12px;
}

.order-item{
display:flex;
justify-content:space-between;
padding:8px 0;
border-bottom:1px solid #eee;
font-size:14px;
}

.order-item-name{
font-weight:bold;
}

.order-total{
display:flex;
justify-content:space-between;
font-size:20px;
font-weight:bold;
margin-top:15px;
}

.empty-cart{
text-align:center;
color:#777;
padding:20px 5px;
}


/* WHATSAPP */

.whatsapp-button{
width:100%;
background:#25D366;
color:white;
border:0;
padding:14px;
border-radius:10px;
font-size:16px;
font-weight:bold;
cursor:pointer;
margin-top:15px;
}


/* DESKTOP */

@media(min-width:700px){

.products{
grid-template-columns:repeat(4,1fr);
}

}


/* MOBILE */

@media(max-width:450px){

.shop-name{
font-size:18px;
}

.cart-button{
padding:9px 12px;
font-size:14px;
}

.product-info{
padding:9px;
}

.product-name{
font-size:14px;
}

.price{
font-size:17px;
}

}

</style>

</head>


<body>


<!-- HEADER -->

<header>

<div class="header-content">

<div class="shop-name">
🛍️ Megical Floor Art
</div>

<button class="cart-button" onclick="openCart()">
🛒 Cart <span id="cartCount">0</span>
</button>

</div>

</header>


<!-- PRODUCTS -->

<div class="container">

<div class="products" id="products"></div>

</div>


<!-- CART -->

<div class="modal" id="cartModal">

<div class="modal-content">

<div class="modal-header">

<h2>🛒 Your Order</h2>

<button class="close" onclick="closeCart()">×</button>

</div>


<div class="form-title">
Customer Details
</div>


<div class="customer-form">

<input
type="text"
id="customerName"
placeholder="Enter your name"
>

<textarea
id="customerAddress"
placeholder="Enter delivery address"
></textarea>

</div>


<div
class="order-summary"
id="orderSummary">
</div>


<div class="order-total">

<span>Grand Total</span>

<span id="grandTotal">
₹0
</span>

</div>


<button
class="whatsapp-button"
onclick="sendWhatsApp()">

📲 Submit Order on WhatsApp

</button>

</div>

</div>


<script>

/* =================================================
   WHATSAPP NUMBER
================================================= */

const WHATSAPP_NUMBER = "917507611433";


/* =================================================
   PRODUCTS
   EDIT ONLY THIS SECTION
================================================= */

const products = [

{
id:1,
name:"Product A",
price:150,
images:[
"images/product1-1.jpg",
"images/product1-2.jpg",
"images/product1-3.jpg"
]
},

{
id:2,
name:"Product B",
price:250,
images:[
"images/product2-1.jpg",
"images/product2-2.jpg",
"images/product2-3.jpg"
]
}

];


/* =================================================
   CART
================================================= */

let cart = {};

let imageIndex = {};


products.forEach(function(product){

cart[product.id] = 0;

imageIndex[product.id] = 0;

});


/* =================================================
   SHOW PRODUCTS
================================================= */

function displayProducts(){

const container =
document.getElementById("products");


let html = "";


products.forEach(function(product){

html += `

<div class="product">


<div
class="slider"
data-id="${product.id}"
>

<img
id="image-${product.id}"
src="${product.images[0]}"
alt="${product.name}"
>


<button
class="arrow prev"
onclick="previousImage(${product.id})"
>
‹
</button>


<button
class="arrow next"
onclick="nextImage(${product.id})"
>
›
</button>


<div class="dots">

${product.images.map(function(image,index){

return `

<span
class="dot ${index === 0 ? "active" : ""}"
id="dot-${product.id}-${index}"
></span>

`;

}).join("")}

</div>


</div>


<div class="product-info">


<div class="product-name">
${product.name}
</div>


<div class="price">
₹${product.price}
</div>


<div class="quantity">


<button
onclick="changeQuantity(${product.id},-1)"
>
−
</button>


<span id="qty-${product.id}">
0
</span>


<button
onclick="changeQuantity(${product.id},1)"
>
+
</button>


</div>


</div>

</div>

`;

});


container.innerHTML = html;


/* ENABLE SWIPE */

products.forEach(function(product){

const slider =
document.querySelector(
`.slider[data-id="${product.id}"]`
);


let startX = 0;


slider.addEventListener(
"touchstart",
function(event){

startX =
event.touches[0].clientX;

},
{passive:true}
);


slider.addEventListener(
"touchend",
function(event){

const endX =
event.changedTouches[0].clientX;

const difference =
startX - endX;


if(Math.abs(difference) > 40){

if(difference > 0){

nextImage(product.id);

}else{

previousImage(product.id);

}

}

},
{passive:true}
);

});

}


/* =================================================
   IMAGE SLIDER
================================================= */

function updateImage(id){

const product =
products.find(function(item){

return item.id === id;

});


const index =
imageIndex[id];


document.getElementById(
`image-${id}`
).src =
product.images[index];


product.images.forEach(
function(image,index){

const dot =
document.getElementById(
`dot-${id}-${index}`
);


if(dot){

dot.classList.toggle(
"active",
index === imageIndex[id]
);

}

});

}


/* NEXT */

function nextImage(id){

const product =
products.find(function(item){

return item.id === id;

});


imageIndex[id]++;

if(
imageIndex[id] >=
product.images.length
){

imageIndex[id] = 0;

}


updateImage(id);

}


/* PREVIOUS */

function previousImage(id){

const product =
products.find(function(item){

return item.id === id;

});


imageIndex[id]--;


if(imageIndex[id] < 0){

imageIndex[id] =
product.images.length - 1;

}


updateImage(id);

}


/* =================================================
   QUANTITY
================================================= */

function changeQuantity(id,change){

cart[id] += change;


if(cart[id] < 0){

cart[id] = 0;

}


document.getElementById(
`qty-${id}`
).innerText =
cart[id];


updateCartCount();

}


/* =================================================
   CART COUNT
================================================= */

function updateCartCount(){

let count = 0;


products.forEach(function(product){

count += cart[product.id];

});


document.getElementById(
"cartCount"
).innerText =
count;

}


/* =================================================
   OPEN CART
================================================= */

function openCart(){

updateOrderSummary();


document.getElementById(
"cartModal"
).classList.add("show");

}


/* =================================================
   CLOSE CART
================================================= */

function closeCart(){

document.getElementById(
"cartModal"
).classList.remove("show");

}


/* =================================================
   ORDER SUMMARY
================================================= */

function updateOrderSummary(){

let total = 0;

let html = "";


products.forEach(function(product){

const quantity =
cart[product.id];


if(quantity > 0){

const itemTotal =
product.price * quantity;


total += itemTotal;


html += `

<div class="order-item">

<div>

<div class="order-item-name">
${product.name}
</div>

Qty: ${quantity}

</div>


<div>
₹${itemTotal}
</div>

</div>

`;

}

});


if(html === ""){

html = `

<div class="empty-cart">

Your cart is empty.

<br><br>

Please select a product first.

</div>

`;

}


document.getElementById(
"orderSummary"
).innerHTML =
html;


document.getElementById(
"grandTotal"
).innerText =
"₹" + total;

}


/* =================================================
   WHATSAPP ORDER
================================================= */

function sendWhatsApp(){

const name =
document.getElementById(
"customerName"
).value.trim();


const address =
document.getElementById(
"customerAddress"
).value.trim();


if(name === ""){

alert("Please enter your name.");

return;

}


if(address === ""){

alert("Please enter your delivery address.");

return;

}


let total = 0;

let itemNumber = 1;


let message =
`🛒 *NEW ORDER*

👤 Customer: ${name}
📍 Address: ${address}

📦 *ORDER DETAILS*

`;


products.forEach(function(product){

const quantity =
cart[product.id];


if(quantity > 0){

const itemTotal =
product.price * quantity;


total += itemTotal;


message +=
`*${itemNumber}. ${product.name}*
Qty: ${quantity}
Price: ₹${product.price}
Total: ₹${itemTotal}

`;


itemNumber++;

}

});


if(total === 0){

alert(
"Please select at least one product."
);

return;

}


message +=
`💰 *GRAND TOTAL: ₹${total}*

📝 Note: Extra courier charges may apply depending on the delivery location.

Please confirm my order.`;


const url =
"https://wa.me/" +
WHATSAPP_NUMBER +
"?text=" +
encodeURIComponent(message);


window.open(url,"_blank");

}


/* =================================================
   CLOSE MODAL OUTSIDE
================================================= */

document.getElementById(
"cartModal"
).addEventListener(
"click",
function(event){

if(event.target === this){

closeCart();

}

});


/* =================================================
   START
================================================= */

displayProducts();

updateCartCount();

</script>


</body>
</html>
